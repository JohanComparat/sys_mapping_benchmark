name: Smoke

# The full benchmark is far too slow for CI (MCMC-comb alone is ~170 s per point).
# This only checks that the harness imports, collects and runs its smallest grid,
# so a broken harness is caught without pretending CI numbers are measurements.
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Collect the timing tests
        run: pytest benchmark/ --collect-only -q
      - name: Smallest possible benchmark grid
        run: |
          python benchmark/benchmark_pipeline.py --groups micro \
            --nsides 16 --n-sys 5 --n-repeat 2 --out-dir /tmp/smoke
          test -s /tmp/smoke/benchmarks.csv
